<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NGINX // Stress Benchmark</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121821;
      --border: #1f2a38;
      --text: #e2e8f0;
      --muted: #8b9bb4;
      --accent: #00e5a0;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      padding: 1.25rem;
      line-height: 1.5;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    h1 { font-size: 1.2rem; color: var(--accent); letter-spacing: 1px; }
    .badge {
      background: #16222f;
      border: 1px solid var(--border);
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
    input, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: 4px;
      font-family: inherit;
    }
    .buttons { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    button {
      cursor: pointer;
      border: none;
      padding: 0.65rem 1.2rem;
      border-radius: 4px;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.85rem;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-start { background: var(--accent); color: #04130d; }
    .btn-ramp { background: var(--warn); color: #1a1000; }
    .btn-stop { background: var(--danger); color: #fff; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.75rem;
    }
    .stat {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.75rem;
      border-radius: 6px;
    }
    .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
    .stat-val { font-size: 1.25rem; font-weight: bold; margin-top: 0.2rem; }
    .ok { color: var(--accent); }
    .err { color: var(--danger); }
    .progress-wrap {
      width: 100%;
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
      margin: 1rem 0 0.5rem;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s linear;
    }
    #log {
      background: #070a0e;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      height: 220px;
      overflow-y: auto;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .log-ok { color: var(--accent); }
    .log-warn { color: var(--warn); }
    .log-err { color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>NGINX // BENCHMARK DE LÍMITE</h1>
      <span class="badge" id="targetDisplay">Host: detectando...</span>
    </header>

    <div class="panel">
      <div class="controls">
        <div>
          <label for="endpoint">Ruta objetivo</label>
          <input type="text" id="endpoint" value="/" />
        </div>
        <div>
          <label for="method">Método HTTP</label>
          <select id="method">
            <option value="HEAD">HEAD (solo cabeceras)</option>
            <option value="GET" selected>GET (descarga completa)</option>
          </select>
        </div>
        <div>
          <label for="total">Peticiones totales</label>
          <input type="number" id="total" value="1000" min="10" max="50000" />
        </div>
        <div>
          <label for="concurrency">Hilos concurrentes</label>
          <input type="number" id="concurrency" value="50" min="1" max="500" />
        </div>
      </div>

      <div class="buttons">
        <button class="btn-start" id="btnStart">LANZAR RÁFAGA FIJA</button>
        <button class="btn-ramp" id="btnRamp">MODO ESCALADA (HASTA ROMPER)</button>
        <button class="btn-stop" id="btnStop" disabled>DETENER</button>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div class="panel">
      <div class="stats-grid">
        <div class="stat"><div class="stat-label">Completadas</div><div class="stat-val" id="stDone">0 / 0</div></div>
        <div class="stat"><div class="stat-label">RPS (Req/s)</div><div class="stat-val ok" id="stRps">0.0</div></div>
        <div class="stat"><div class="stat-label">Éxitos (2xx)</div><div class="stat-val ok" id="stOk">0</div></div>
        <div class="stat"><div class="stat-label">Errores / Timeout</div><div class="stat-val err" id="stErr">0</div></div>
        <div class="stat"><div class="stat-label">Latencia Media</div><div class="stat-val" id="stAvg">0 ms</div></div>
        <div class="stat"><div class="stat-label">Percentil 95 (P95)</div><div class="stat-val" id="stP95">0 ms</div></div>
        <div class="stat"><div class="stat-label">Mín / Máx</div><div class="stat-val" id="stMinMax">0 / 0 ms</div></div>
        <div class="stat"><div class="stat-label">Concurrencia Actual</div><div class="stat-val" id="stConc">0</div></div>
      </div>
    </div>

    <div id="log"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    $('targetDisplay').textContent = `Origen: ${window.location.origin}`;

    let abortController = null;
    let running = false;

    function addLog(msg, cls = '') {
      const line = document.createElement('div');
      if (cls) line.className = cls;
      const time = new Date().toLocaleTimeString('es-ES', { hour12: false });
      line.textContent = `[${time}] ${msg}`;
      $('log').prepend(line);
    }

    function updateStats(done, total, ok, err, latencies, startTime, conc) {
      const elapsed = (performance.now() - startTime) / 1000;
      const rps = elapsed > 0 ? (done / elapsed).toFixed(1) : '0.0';
      $('stDone').textContent = `${done} / ${total}`;
      $('stRps').textContent = rps;
      $('stOk').textContent = ok;
      $('stErr').textContent = err;
      $('stConc').textContent = conc;
      $('progressBar').style.width = total > 0 ? `${Math.min(100, (done / total) * 100)}%` : '100%';

      if (latencies.length > 0) {
        const sorted = [...latencies].sort((a, b) => a - b);
        const sum = sorted.reduce((a, b) => a + b, 0);
        const avg = (sum / sorted.length).toFixed(1);
        const p95 = sorted[Math.floor(sorted.length * 0.95)].toFixed(1);
        const min = sorted[0].toFixed(1);
        const max = sorted[sorted.length - 1].toFixed(1);
        $('stAvg').textContent = `${avg} ms`;
        $('stP95').textContent = `${p95} ms`;
        $('stMinMax').textContent = `${min} / ${max}`;
      }
    }

    async function fireOne(url, method, signal) {
      const t0 = performance.now();
      const bustUrl = `${url}${url.includes('?') ? '&' : '?'}_t=${Math.random().toString(36).slice(2)}`;
      const res = await fetch(bustUrl, { method, cache: 'no-store', signal });
      await res.arrayBuffer();
      const dt = performance.now() - t0;
      return { ok: res.ok, status: res.status, dt };
    }

    async function runBatch(total, concurrency) {
      running = true;
      abortController = new AbortController();
      $('btnStart').disabled = true;
      $('btnRamp').disabled = true;
      $('btnStop').disabled = false;

      const endpoint = $('endpoint').value.trim() || '/';
      const method = $('method').value;
      let launched = 0, done = 0, ok = 0, err = 0;
      const latencies = [];
      const startTime = performance.now();

      addLog(`Iniciando ráfaga: ${total} peticiones (${method} ${endpoint}) con ${concurrency} hilos...`, 'log-warn');

      async function worker() {
        while (running && launched < total) {
          launched++;
          try {
            const res = await fireOne(endpoint, method, abortController.signal);
            done++;
            if (res.ok) {
              ok++;
              latencies.push(res.dt);
            } else {
              err++;
              if (err <= 5) addLog(`HTTP ${res.status} recibido`, 'log-err');
            }
          } catch (e) {
            if (!running) break;
            done++;
            err++;
            if (err <= 5) addLog(`Fallo de red/timeout: ${e.message}`, 'log-err');
          }
          if (done % 10 === 0 || done === total) {
            updateStats(done, total, ok, err, latencies, startTime, concurrency);
          }
        }
      }

      const workers = Array.from({ length: concurrency }, () => worker());
      await Promise.all(workers);

      updateStats(done, total, ok, err, latencies, startTime, concurrency);
      const totalSec = ((performance.now() - startTime) / 1000).toFixed(2);
      addLog(`Finalizado en ${totalSec}s -> ${ok} OK | ${err} fallos | ${(done / totalSec).toFixed(1)} req/s`, err > 0 ? 'log-warn' : 'log-ok');

      running = false;
      $('btnStart').disabled = false;
      $('btnRamp').disabled = false;
      $('btnStop').disabled = true;
    }

    async function runRamp() {
      const levels = [10, 25, 50, 100, 150, 250, 400];
      addLog('Iniciando escalada progresiva de concurrencia...', 'log-warn');
      for (const conc of levels) {
        if (!running && conc !== levels[0]) break;
        const reqs = conc * 8;
        $('concurrency').value = conc;
        $('total').value = reqs;
        await runBatch(reqs, conc);
        const errors = parseInt($('stErr').textContent, 10);
        if (errors > 0) {
          addLog(`Límite detectado en concurrencia x${conc} (${errors} errores). Escalada detenida.`, 'log-err');
          break;
        }
        await new Promise(r => setTimeout(r, 600));
        if ($('btnStop').disabled && conc !== levels[levels.length - 1]) break;
      }
    }

    $('btnStart').addEventListener('click', () => {
      const total = Math.max(1, parseInt($('total').value, 10) || 500);
      const conc = Math.max(1, parseInt($('concurrency').value, 10) || 20);
      runBatch(total, conc);
    });

    $('btnRamp').addEventListener('click', () => {
      running = true;
      runRamp();
    });

    $('btnStop').addEventListener('click', () => {
      running = false;
      if (abortController) abortController.abort();
      addLog('Prueba abortada manualmente.', 'log-err');
      $('btnStart').disabled = false;
      $('btnRamp').disabled = false;
      $('btnStop').disabled = true;
    });
  </script>
</body>
</html>
